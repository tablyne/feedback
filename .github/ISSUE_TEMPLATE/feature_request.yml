name: 💡 Feature request
description: Suggest an idea or improvement for Tablyne
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: What are you trying to do, and where does Tablyne get in the way?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: How would you like it to work? Mockups/screenshots welcome.
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
